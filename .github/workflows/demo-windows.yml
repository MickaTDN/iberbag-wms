name: DEMO Windows
on:
  push:
    branches: [main, codex/windows-local-demo]
    paths: ['iberbag_demo/**', 'iberbag/templates/base.html', 'iberbag/static/**', 'iberbag/commercial_pdf.py', 'scripts/*demo*', 'demo_tests/**', '*DEMO*', 'requirements-demo.txt', '.github/workflows/demo-windows.yml']
  pull_request:
    paths: ['iberbag_demo/**', 'iberbag/templates/base.html', 'iberbag/static/**', 'iberbag/commercial_pdf.py', 'scripts/*demo*', 'demo_tests/**', '*DEMO*', 'requirements-demo.txt', '.github/workflows/demo-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-demo:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar apenas dependências da DEMO e testes
        run: python -m pip install -r requirements-demo.txt "pyinstaller>=6,<7" "pytest>=8,<10" "httpx>=0.27,<1" "pypdf>=5,<7"
      - name: Testar simulação e arranque local Windows
        run: python -m pytest -q demo_tests
      - name: Criar distribuição autónoma Windows x64
        run: python scripts/build_demo.py --standalone --output dist/IBERBAG-DEMO-Windows-x64
      - name: Testar executável empacotado, sem Python externo
        run: python scripts/smoke_demo_package.py dist/IBERBAG-DEMO-Windows-x64
      - name: Remover apenas estado criado pelo ensaio do pacote
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root=Path('dist/IBERBAG-DEMO-Windows-x64')
          demo=root/'DEMO'
          if demo.exists():
              shutil.rmtree(demo)
          (root/'VALIDACAO_PACOTE.txt').write_text('Pacote criado e testado automaticamente em windows-2025 (Windows Server), Python 3.12/PyInstaller. Arranque real em 127.0.0.1, fluxos HTTP, PDFs, reposicao e encerramento. Sem PostgreSQL, Docker ou Python externo no executavel. Nao substitui aceitacao fisica Windows 11, antivirus e impressora.\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: IBERBAG-DEMO-Windows-x64
          path: dist/IBERBAG-DEMO-Windows-x64/
          if-no-files-found: error
          retention-days: 30
