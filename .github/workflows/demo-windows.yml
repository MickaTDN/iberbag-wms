name: DEMO Windows
on:
  push:
    branches: [main, codex/windows-local-demo]
    paths: ['iberbag_demo/**', 'packaging/**', 'iberbag/templates/base.html', 'iberbag/static/**', 'iberbag/commercial_pdf.py', 'scripts/*demo*', 'demo_tests/**', '*DEMO*', 'requirements-demo.txt', '.github/workflows/demo-windows.yml']
  pull_request:
    paths: ['iberbag_demo/**', 'packaging/**', 'iberbag/templates/base.html', 'iberbag/static/**', 'iberbag/commercial_pdf.py', 'scripts/*demo*', 'demo_tests/**', '*DEMO*', 'requirements-demo.txt', '.github/workflows/demo-windows.yml']
  workflow_dispatch:
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-demo:
    name: Código de demonstração — sem executável próprio
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas para testes do código
        run: python -m pip install -r requirements-demo.txt "pytest>=8,<10" "httpx>=0.27,<1" "pypdf>=5,<7" "playwright>=1.50,<2"
      - name: Testar simulação isolada
        run: python -m pytest -q demo_tests
      - name: Criar pacote de código por lista explícita
        run: python scripts/build_demo.py --output dist/IBERBAG-DEMO-Codigo-Windows
      - name: Preparar ensaio local numa pasta nova com espaços e acentos
        shell: python
        run: |
          import shutil,subprocess,sys
          from pathlib import Path
          root=Path('dist/Ensaio Código ação')
          shutil.copytree(Path('dist/IBERBAG-DEMO-Codigo-Windows'),root)
          subprocess.run([sys.executable,'-I','-B','-m','venv',str(root/'demo-env')],check=True)
          subprocess.run([str(root/'demo-env/Scripts/python.exe'),'-I','-B','-m','pip','--isolated','install','--disable-pip-version-check','--no-cache-dir','-r',str(root/'requirements-demo.txt')],check=True)
      - name: Testar pacote de código com Python local oficial
        run: python scripts/smoke_demo_package.py "dist/Ensaio Código ação" --source
      - name: Testar formulários nativos no Google Chrome instalado
        run: python scripts/test_demo_browser.py --channel chrome --package "dist/Ensaio Código ação"
      - name: Testar formulários nativos no Microsoft Edge instalado
        run: python scripts/test_demo_browser.py --channel msedge --package "dist/Ensaio Código ação"
      - uses: actions/upload-artifact@v4
        with:
          name: IBERBAG-DEMO-Codigo-Windows
          path: dist/IBERBAG-DEMO-Codigo-Windows/
          if-no-files-found: error
          retention-days: 30
  build-demo:
    # Suspended after the reported Trend Micro detection; do not rerun the flagged binary.
    if: ${{ false }}
    name: Executável suspenso — alerta antivírus em análise
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar apenas dependências da DEMO e testes
        run: python -m pip install -r requirements-demo.txt "pyinstaller>=6,<7" "pytest>=8,<10" "httpx>=0.27,<1" "pypdf>=5,<7"
      - name: Testar simulação e arranque local Windows
        run: python -m pytest -q demo_tests
      - name: Criar distribuição autónoma Windows x64
        run: python scripts/build_demo.py --standalone --output dist/IBERBAG-DEMO-Windows-x64
      - name: Copiar para pasta de ensaio com espaços e acentos
        shell: python
        run: |
          from pathlib import Path
          import shutil
          shutil.copytree(Path('dist/IBERBAG-DEMO-Windows-x64'),Path('dist/Ensaio DEMO ação'))
      - name: Testar executável empacotado, sem Python externo
        run: python scripts/smoke_demo_package.py "dist/Ensaio DEMO ação"
      - name: Remover apenas estado criado pelo ensaio do pacote
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root=Path('dist/IBERBAG-DEMO-Windows-x64')
          demo=root/'DEMO'
          if demo.exists():
              shutil.rmtree(demo)
          (root/'VALIDACAO_PACOTE.txt').write_text('Pacote criado e testado automaticamente em windows-2025 (Windows Server), Python 3.12/PyInstaller. Arranque real em 127.0.0.1, fluxos HTTP, PDFs, reposicao e encerramento. Sem PostgreSQL, Docker ou Python externo no executavel. Nao substitui aceitacao fisica Windows 11, antivirus e impressora.\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: IBERBAG-DEMO-Windows-x64
          path: dist/IBERBAG-DEMO-Windows-x64/
          if-no-files-found: error
          retention-days: 30
