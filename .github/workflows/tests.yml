name: Tests
on:
  push:
    branches: [main]
  pull_request:
env:
  PYTHONUTF8: '1'
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: SQLite consultation regression
        run: python -m pytest -q --junitxml=.test-results/sqlite.xml
      - name: PostgreSQL operational regression
        run: python scripts/test_postgres.py --junitxml=.test-results/postgres.xml
      - name: Require executed PostgreSQL coverage and sanitized evidence
        if: always()
        run: |
          python scripts/verify_test_report.py .test-results/sqlite.xml --backend sqlite --output .test-results/sqlite-proof.json
          python scripts/verify_test_report.py .test-results/postgres.xml --backend postgres --output .test-results/postgres-proof.json
      - name: Archive test evidence without traces or fixture secrets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-integration-proof-linux-${{ github.run_attempt }}
          path: .test-results/*-proof.json
          include-hidden-files: true # only the explicit sanitized proof glob above
          if-no-files-found: error

  windows-sqlite:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify native Windows backup ACLs including negative cases
        run: python -m pytest -q tests/test_security_hardening.py::test_private_directory_restricts_inheritance_and_refuses_links tests/windows
      - name: Windows SQLite consultation regression
        run: python -m pytest -q --junitxml=.test-results/windows-sqlite.xml
      - name: Record Windows evidence
        if: always()
        run: python scripts/verify_test_report.py .test-results/windows-sqlite.xml --backend sqlite --output .test-results/windows-sqlite-proof.json
      - name: Archive test evidence without traces or fixture secrets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-integration-proof-windows-${{ github.run_attempt }}
          path: .test-results/*-proof.json
          include-hidden-files: true # only the explicit sanitized proof glob above
          if-no-files-found: error
