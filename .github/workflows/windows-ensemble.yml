name: Windows rehearsal package
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download only hash-pinned Windows wheels
        run: python -m pip download --only-binary=:all: -r requirements-prod.lock --dest wheels
      - name: Build allowlisted source package
        run: python scripts/build_windows_ensemble.py --wheels wheels --output dist
      - name: Verify extracted package and install its wheels on Windows Server runner
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist\*.zip
          Expand-Archive $archive.FullName -DestinationPath "$env:RUNNER_TEMP\DDN ensaio á"
          $script = Join-Path "$env:RUNNER_TEMP\DDN ensaio á" 'windows\assistente.py'
          "2" | python -I $script
          if ($LASTEXITCODE -ne 0) { throw 'Manifest verification failed' }
          # This runner is Windows Server, not Windows 11. Exercise dependency
          # installation separately; never bypass the bootstrap's OS guard.
          $venv = Join-Path "$env:RUNNER_TEMP\DDN ensaio á" '.ddn-venv'
          python -I -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Venv creation failed' }
          $runtime = Join-Path "$env:RUNNER_TEMP\DDN ensaio á" '.ddn-venv\Scripts\python.exe'
          $wheels = Join-Path "$env:RUNNER_TEMP\DDN ensaio á" 'wheels'
          $lock = Join-Path "$env:RUNNER_TEMP\DDN ensaio á" 'requirements-prod.lock'
          & $runtime -I -m pip --isolated install --no-index --no-cache-dir --find-links $wheels -r $lock
          if ($LASTEXITCODE -ne 0) { throw 'Offline dependency installation failed' }
          & $runtime -I -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency check failed' }
      - name: Archive rehearsal package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DDN_WMS_Windows_Ensaio-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
